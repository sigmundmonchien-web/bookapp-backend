parameters:
    google_books_api_key: '%env(GOOGLE_BOOKS_API_KEY)%'
    profile_photos_directory: '%kernel.project_dir%/public/uploads/profile-photos'
    profile_photos_public_path: '/uploads/profile-photos'
    profile_photo_max_size: 5242880  # 5 Mo en octets
    profile_photo_allowed_mime_types:
        - 'image/jpeg'
        - 'image/png'
        - 'image/webp'
    app.contact_email: '%env(CONTACT_EMAIL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $contactEmail: '%env(CONTACT_EMAIL)%'
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Controller\BookController:
        arguments:
            $googleBooksApiKey: '%google_books_api_key%'

    App\Service\BookService:
        arguments:
            $googleBooksApiKey: '%google_books_api_key%'        


    App\Service\ProfilePhotoUploader:
        arguments:
            $profilePhotosDirectory: '%profile_photos_directory%'
            $profilePhotoMaxSize: '%profile_photo_max_size%'
            $profilePhotoAllowedMimeTypes: '%profile_photo_allowed_mime_types%'      

    App\Controller\MeController:
        arguments:
            $profilePhotosPublicPath: '%profile_photos_public_path%'      